global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/jenkins-alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "jenkins"
    metrics_path: /prometheus/
    static_configs:
      - targets:
          - "jenkins-blueocean:8080"
