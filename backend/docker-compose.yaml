services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dev}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-dev}
      DATABASE_USER: ${POSTGRES_USER:-root}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-dev}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Windows example: UPLOADS_PATH=C:/Users/your-name/my-app/uploads
      - type: bind
        source: ${UPLOADS_PATH:-./uploads}
        target: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
